version: "2"

run:
  build-tags:
    - eval

linters:
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - ireturn
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - wrapcheck
  settings:
    depguard:
      rules:
        tests:
          deny:
            - pkg: github.com/stretchr/testify
              desc: use the stdlib and go-cmp
        # gate, llm, and agent are allow-lists (strict): a new internal package is
        # denied until it is added here.
        gate-domain:
          list-mode: strict
          files:
            - "**/internal/gate/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/review$
        auth-domain:
          list-mode: strict
          files:
            - "**/internal/auth/*.go"
            - "!$test"
          allow:
            - $gostd
        review-contracts:
          files:
            - "**/internal/review/*.go"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal
              desc: internal/review imports nothing else from this module
        docs-leaf:
          files:
            - "**/internal/docs/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal
              desc: internal/docs imports no other internal package
        runners:
          files:
            - "**/internal/review/*/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/github
              desc: runners reach GitHub only through their own interfaces or a token func from cmd/server
        instructions-leaf:
          files:
            - "**/internal/review/instructions/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
        pipeline:
          list-mode: strict
          files:
            - "**/internal/review/pipeline/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/review$
            - github.com/mrkizildag/pollux-agent/backend/internal/review/basedocs
            - github.com/mrkizildag/pollux-agent/backend/internal/review/finalize
            - github.com/mrkizildag/pollux-agent/backend/internal/review/input
            - github.com/mrkizildag/pollux-agent/backend/internal/review/instructions
            - github.com/mrkizildag/pollux-agent/backend/internal/docs
        # actions joins this rule when it moves onto the pipeline
        agent-backends:
          files:
            - "**/internal/review/llmrunner/**"
            - "!$test"
          deny:
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/basedocs
              desc: selection, validation, doc parsing and prompts belong to pipeline
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/docs
              desc: selection, validation, doc parsing and prompts belong to pipeline
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/finalize
              desc: selection, validation, doc parsing and prompts belong to pipeline
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/instructions
              desc: selection, validation, doc parsing and prompts belong to pipeline
            - pkg: github.com/mrkizildag/pollux-agent/backend/internal/review/input
              desc: selection, validation, doc parsing and prompts belong to pipeline
        llm-agent-leaf:
          files:
            - "**/internal/llm/**"
            - "**/internal/agent/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/mrkizildag/pollux-agent/backend/internal/llm
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(os\.(Getenv|LookupEnv|Environ|ExpandEnv)|syscall\.(Getenv|Environ))$
          msg: read the environment only in internal/config
        - pattern: ^(os\.Exit|log\.Fatal.*)$
          msg: only main exits
        - pattern: ^http\.(Get|Post|DefaultClient)$
          msg: inject an *http.Client with a timeout
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - anon
        - generic
        - github.com/mrkizildag/pollux-agent/backend/internal/review.Started
        - github.com/mrkizildag/pollux-agent/backend/internal/review.ScaffoldStarted
        - github.com/mrkizildag/pollux-agent/backend/internal/review.Verdict
        - github.com/mrkizildag/pollux-agent/backend/internal/review/pipeline.Workspace
  exclusions:
    rules:
      - path: internal/config/
        linters: [forbidigo]
        text: read the environment only in internal/config
      - path: cmd/
        linters: [forbidigo]
        text: os\.Exit
      - path: _test\.go
        linters: [gosec]
        text: G101

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mrkizildag/pollux-agent
